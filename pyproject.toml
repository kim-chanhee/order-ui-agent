[project]
name = "order-ui-agent"
version = "0.1.0"
description = "FastAPI UI for a schema-driven read-only SQLite agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn>=0.34",
  "langchain-openai>=0.3.0",
  "python-dotenv>=1.0",
  "sqlglot>=30.18.0",
]

[project.scripts]
order-ui-agent = "app.server:main"
order-ui-agent-experiment-summary = "app.experiment.analysis:main"
order-ui-agent-eval-accuracy = "app.eval.accuracy_eval:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "templates/*.html",
  "experiment/tasks.json",
  "static/*.css",
  "static/*.js",
  "static/js/*.js",
  "static/js/a2ui/*.js",
  "static/js/components/*.js",
  "static/js/modes/*.js",
  "static/js/a2ui/plan/*.js",
  "static/js/components/a2ui/*.js",
  "static/js/surfaces/*.js",
  "static/a2ui/*.css",
  "static/js/results/*.js",
  "static/js/results/a2ui/*.js",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "ipykernel>=6.30.1",
  "matplotlib>=3.8",
  "pandas>=2.0.0",
  "pytest>=9.1.1",
  "statsmodels>=0.14.5",
]
